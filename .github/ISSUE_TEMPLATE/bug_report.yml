name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: |
        Use fictional data and remove private details from logs and screenshots.
        For security vulnerabilities, follow SECURITY.md instead of this form.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or version, OS, Node version, browser, and relevant integration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Do not include tokens, private addresses, or business/customer data.
