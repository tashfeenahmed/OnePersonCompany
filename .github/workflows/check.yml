name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chrome's sandbox
      # needs. google-chrome ships an AppArmor profile that exempts it; the
      # runner's /usr/bin/chromium (found first) does not, and aborts at start.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run setup
      - run: npm run check
