<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">One Person Company</title>
  <desc id="desc">Your ventures. Your numbers. Your next move. From idea to pre-launch to launched.</desc>
  <defs>
    <radialGradient id="glow" cx="85%" cy="40%" r="80%"><stop offset="0" stop-color="#3b473d"/><stop offset="1" stop-color="#131410"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#af99d9"/><stop offset=".55" stop-color="#d8b87b"/><stop offset="1" stop-color="#80c9a0"/></linearGradient>
  </defs>
  <rect width="1600" height="420" rx="26" fill="#131410"/>
  <rect width="1600" height="420" rx="26" fill="url(#glow)" opacity=".65"/>
  <g fill="none" stroke="#34382f" opacity=".55">
    <circle cx="1330" cy="200" r="315"/><circle cx="1330" cy="200" r="250"/><circle cx="1330" cy="200" r="185"/>
  </g>
  <rect x="72" y="54" width="42" height="42" rx="14" fill="#f2f0e9"/>
  <text x="93" y="83" text-anchor="middle" fill="#171713" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">1</text>
  <text x="128" y="82" fill="#c9c9bd" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="1">ONE PERSON COMPANY</text>
  <text x="72" y="181" fill="#f5f3ec" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Your ventures. Your numbers.</text>
  <text x="72" y="252" fill="#a5d7b8" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Your next move.</text>
  <text x="75" y="319" fill="#aaa99e" font-family="Arial,Helvetica,sans-serif" font-size="23">The workspace for running a company of one.</text>
  <g transform="translate(1104 128)">
    <path d="M24 25V177" stroke="url(#line)" stroke-width="2"/>
    <rect x="0" y="0" width="334" height="52" rx="16" fill="#22251f" stroke="#49423f"/>
    <circle cx="25" cy="26" r="6" fill="#af99d9"/>
    <text x="47" y="33" fill="#e3dded" font-family="Arial,Helvetica,sans-serif" font-size="21">Idea</text>
    <text x="310" y="33" text-anchor="end" fill="#99958f" font-family="Arial,Helvetica,sans-serif" font-size="16">Find the opportunity</text>
    <rect x="0" y="75" width="334" height="52" rx="16" fill="#22251f" stroke="#4c4738"/>
    <circle cx="25" cy="101" r="6" fill="#d8b87b"/>
    <text x="47" y="108" fill="#e6dcc6" font-family="Arial,Helvetica,sans-serif" font-size="21">Pre-launch</text>
    <text x="310" y="108" text-anchor="end" fill="#99958f" font-family="Arial,Helvetica,sans-serif" font-size="16">Get ready to ship</text>
    <rect x="0" y="150" width="334" height="52" rx="16" fill="#28332b" stroke="#52735b"/>
    <circle cx="25" cy="176" r="6" fill="#80c9a0"/>
    <text x="47" y="183" fill="#e1ede2" font-family="Arial,Helvetica,sans-serif" font-size="21">Launched</text>
    <text x="310" y="183" text-anchor="end" fill="#a3b7a7" font-family="Arial,Helvetica,sans-serif" font-size="16">Build momentum</text>
  </g>
