<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Plugins · One Person Company</title>
<link rel="stylesheet" href="app.css" />
<style>
  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

  .search {
    display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 220px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 10px; color: var(--muted);
    transition: border-color .14s ease;
  }

  .search:focus-within { border-color: var(--text); }
  .search input { border: 0; outline: 0; background: none; width: 100%; color: var(--text); }
  .search input::placeholder { color: var(--faint); opacity: .85; }

  .tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 18px; }

  .tab { padding: 5px 10px; border-radius: 8px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab[aria-selected="true"] { background: var(--hover); color: var(--text); font-weight: 500; }
  .tab .n { color: var(--muted); font-size: 11px; margin-left: 4px; }

  .group-label {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 10px;
  }
  .group-label:first-of-type { margin-top: 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 8px; }

  .card {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: border-color .12s ease, transform .12s ease;
  }

  .card:hover { border-color: var(--line-strong); }
  .card:active { transform: translateY(1px); }

  .card-body { min-width: 0; flex: 1; }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-name { font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em; }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; margin-left: auto; }
  .card[data-connected="false"] .dot { background: var(--line); }

  .card-desc {
    font-size: 12px; color: var(--muted); margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .card-meta { display: flex; align-items: center; gap: 6px; margin-top: 9px; }

  .used { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }

  .used li {
    font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); display: flex; gap: 7px; align-items: baseline;
  }

  .used li::before { content: "\2192"; color: var(--muted); }

  .docs {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--muted);
    padding: 5px 8px; border-radius: 8px; margin-left: -8px;
  }

  .docs:hover { background: var(--hover); color: var(--text); }
</style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
  <header class="topbar">

</aside>

    id: 'hackernews', name: 'Hacker News', icon: 'ycombinator', cat: 'signals', connected: true,
    secret: null, desc: 'Mentions and launch chatter, via the Algolia search API.',
    help: 'The HN Algolia API is public — nothing to configure. Scanned for brand mentions and for demand signals on the same schedule as Reddit.',
    docs: 'https://hn.algolia.com/api',
    fields: [],
    usedBy: ['collect_demand.py (demand.json)', 'collect_presence.py (presence.json)'],
  },
];

/* ---------- render ---------- */
const results = document.getElementById('results');
const tabsEl = document.getElementById('tabs');
const qEl = document.getElementById('q');
let activeCat = 'all';

document.getElementById('totalCount').textContent = PLUGINS.length;
document.getElementById('connectedCount').textContent = PLUGINS.filter(p => p.connected).length;

const tileFor = brandTile;

function catLabel(id) {
  const c = CATEGORIES.find(c => c.id === id);
  return c ? c.label : id;
}

function renderTabs() {
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(c => {
    const n = c.id === 'all' ? PLUGINS.length
      : c.id === 'connected' ? PLUGINS.filter(p => p.connected).length
      : PLUGINS.filter(p => p.cat === c.id).length;
    const b = document.createElement('button');
    b.className = 'tab';
    b.setAttribute('aria-selected', String(c.id === activeCat));
    b.innerHTML = c.label + '<span class="n">' + n + '</span>';
    b.addEventListener('click', () => { activeCat = c.id; renderTabs(); render(); });
    tabsEl.appendChild(b);
  });
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  let list = PLUGINS.filter(p => {
    if (activeCat === 'connected' && !p.connected) return false;
    if (activeCat !== 'all' && activeCat !== 'connected' && p.cat !== activeCat) return false;
    if (!q) return true;
    return (p.name + ' ' + p.desc + ' ' + (p.secret || '') + ' ' + catLabel(p.cat)).toLowerCase().includes(q);
  });

  results.innerHTML = '';
  if (!list.length) {
    results.innerHTML = '<p class="empty-note">Nothing matches that. Every integration here is custom built — if it is missing, it has not been wired up yet.</p>';
    return;
  }

  // group by category unless the user narrowed to one
  const groups = (activeCat === 'all' || activeCat === 'connected')
    ? CATEGORIES.filter(c => c.id !== 'all' && c.id !== 'connected')
        .map(c => [c.label, list.filter(p => p.cat === c.id)])
        .filter(([, items]) => items.length)
    : [[null, list]];

  groups.forEach(([label, items]) => {
    if (label) {
      const h = document.createElement('div');
      h.className = 'group-label';
      h.textContent = label;
      results.appendChild(h);
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(p => grid.appendChild(cardFor(p)));
    results.appendChild(grid);
  });
}

function cardFor(p) {
  const card = document.createElement('button');
  card.className = 'card';
  card.dataset.connected = String(!!p.connected);

  const body = document.createElement('div');
  body.className = 'card-body';

  const top = document.createElement('div');
  top.className = 'card-top';
  top.innerHTML = '<span class="card-name"></span><span class="dot"></span>';
  top.querySelector('.card-name').textContent = p.name;

  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = p.desc;

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  const status = document.createElement('span');
  status.className = 'pill' + (p.connected ? ' on' : '');
  status.textContent = p.connected ? 'Connected' : (p.fields.length ? 'Set up' : 'No key needed');
  meta.appendChild(status);
  if (p.secret) {
    const s = document.createElement('span');
    s.className = 'pill';
    s.textContent = p.secret;
    meta.appendChild(s);
  }

  body.append(top, desc, meta);
  card.append(tileFor(p), body);
  card.addEventListener('click', () => openDrawer(p));
  return card;
}

/* ---------- drawer ---------- */
const drawer = document.getElementById('drawer');

let current = null;

function openDrawer(p) {
  current = p;
  const tile = document.getElementById('dTile');
  tile.replaceWith(Object.assign(tileFor(p), { id: 'dTile' }));
  document.getElementById('dTile').className = 'tile';

  document.getElementById('dName').textContent = p.name;
  document.getElementById('dSub').textContent = p.connected
    ? (p.secret ? 'Connected · vault entry ' + p.secret : 'Connected · no credential')
    : (p.fields.length ? 'Not connected' : 'Nothing to configure');
  document.getElementById('dHelp').textContent = p.help;

  const docs = document.getElementById('dDocs');
  if (p.docs) { docs.href = p.docs; docs.style.display = 'inline-flex'; }
  else { docs.style.display = 'none'; }

  const fields = document.getElementById('dFields');
  fields.innerHTML = '';
  if (p.fields.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Credentials';
    fields.appendChild(lbl);
  }
  p.fields.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const id = 'f-' + p.id + '-' + f.key;
    wrap.innerHTML =
      '<label for="' + id + '"></label>' +
      '<input id="' + id + '" type="' + (f.kind === 'secret' ? 'password' : 'text') + '" autocomplete="off" spellcheck="false">' +
      '<div class="hint"></div>';
    wrap.querySelector('label').textContent = f.label;
    const input = wrap.querySelector('input');
    input.placeholder = f.ph || '';
    if (p.connected && f.kind === 'secret') { input.value = '••••••••••••••••'; }
    wrap.querySelector('.hint').textContent = f.kind === 'secret'
      ? 'Stored as ' + (p.fields.length > 1 ? p.secret + '-' + f.key : p.secret) + ', write-only.'
      : 'Public by design — shown in full.';
    fields.appendChild(wrap);
  });

  const usedWrap = document.getElementById('dUsedWrap');
  const used = document.getElementById('dUsed');
  used.innerHTML = '';
  if (p.usedBy && p.usedBy.length) {
    usedWrap.style.display = '';
    p.usedBy.forEach(u => {
      const li = document.createElement('li');
      li.textContent = u;
      used.appendChild(li);
    });
  } else {
    usedWrap.style.display = 'none';
  }

  const save = document.getElementById('dSave');
  const disc = document.getElementById('dDisconnect');
  save.textContent = p.connected ? 'Save changes' : 'Connect';
  save.style.display = p.fields.length ? '' : 'none';
  disc.style.display = p.connected && p.fields.length ? '' : 'none';

  document.body.classList.add('drawer-open');
  drawer.setAttribute('aria-hidden', 'false');
}

function closeDrawer() {
  document.body.classList.remove('drawer-open');
  drawer.setAttribute('aria-hidden', 'true');
  current = null;
}

document.getElementById('dClose').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

document.getElementById('dSave').addEventListener('click', () => {
  if (!current) return;
  current.connected = true;
  document.getElementById('connectedCount').textContent = PLUGINS.filter(p => p.connected).length;
  renderTabs(); render(); closeDrawer();
});

document.getElementById('dDisconnect').addEventListener('click', () => {
  if (!current) return;
  current.connected = false;
  document.getElementById('connectedCount').textContent = PLUGINS.filter(p => p.connected).length;
  renderTabs(); render(); closeDrawer();
});

qEl.addEventListener('input', render);

renderTabs();
render();

</script>
</body>
</html>
