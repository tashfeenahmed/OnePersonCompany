<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One Person Company</title>
<link rel="stylesheet" href="app.css" />
<style>
  .stage {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 24px 0;
  }

  .empty { width: 100%; max-width: 760px; }

  .greeting { font-size: 25px; font-weight: 400; letter-spacing: -0.025em; margin: 0 0 6px; }
  .greeting span { color: var(--muted); }
  .subline { margin: 0 0 26px; color: var(--muted); font-size: 13.5px; }

  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .suggestion {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 13px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); text-align: left;
    transition: border-color .12s ease, transform .12s ease;
  }

  .suggestion:hover { border-color: var(--line-strong); }
  .suggestion:active { transform: translateY(1px); }
  .suggestion .icon { margin-top: 1px; color: var(--muted); }
  .suggestion:hover .icon { color: var(--text); }
  .suggestion-title { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; }
  .suggestion-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .composer-wrap { flex: none; padding: 20px 24px 22px; display: flex; justify-content: center; }
  .composer-col { width: 100%; max-width: 760px; }

  .composer {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 12px 8px;
    transition: border-color .14s ease, box-shadow .14s ease;
  }

  .composer:focus-within { border-color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.04); }

  .composer textarea {
    display: block; width: 100%;
    min-height: 46px; max-height: 200px;
    border: 0; outline: 0; resize: none; background: none;
    color: var(--text); font: inherit; line-height: 1.55;
    padding: 5px 6px 8px;
  }

  .composer textarea::placeholder { color: var(--faint); opacity: .85; }
  .composer-bar { display: flex; align-items: center; gap: 2px; }

  .ghost-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 8px;
    color: var(--text); font-size: 12.5px;
  }

  .ghost-btn:hover { background: var(--hover); color: var(--text); }
  .ghost-btn .icon { width: 15px; height: 15px; }

  .send {
    margin-left: auto;
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--bg);
    opacity: .25; pointer-events: none;
    transition: opacity .14s ease;
  }

  .composer.has-text .send { opacity: 1; pointer-events: auto; }

  .footnote { margin: 10px auto 0; text-align: center; font-size: 11.5px; color: var(--muted); }

  @media (max-width: 820px) { .suggestions { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
  <header class="topbar">
    <button class="chip" id="projectPicker">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V7a2 2 0 0 1 2-2h3.6a1 1 0 0 1 .8.4l1.2 1.6H18a2 2 0 0 1 2 2v11"/><path d="M2 20h20"/></svg>
      <span id="projectPickerName">Unsorted</span>
      <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="topbar-right">
      <a class="chip" href="dashboards.html">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      </a>
      <a class="chip" href="plugins.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2H9v3a2 2 0 0 1-2 2H4v3a2 2 0 0 1 0 4v3h3a2 2 0 0 1 4 0h3v-3a2 2 0 0 1 2-2h3V9a2 2 0 0 1 0-4V2h-3"/></svg>
      </a>
    </div>
  </header>

  <section class="stage">
    <div class="empty">
      <h1 class="greeting">Good afternoon, Alex. <span>What are we shipping?</span></h1>
      <p class="subline">Start from scratch, or pick up one of these.</p>

      <div class="suggestions">
        <button class="suggestion" data-prompt="Explore standard startup templates and show me what fits a solo founder.">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/></svg>
          <span>
            <span class="suggestion-title">Explore starter templates</span>
            <span class="suggestion-desc">Standard startup scaffolds, ready to fork</span>
          </span>
        </button>

        <button class="suggestion" data-prompt="Help me build a new feature. Start by asking what the feature is.">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg>
          <span>
            <span class="suggestion-title">Build a new feature</span>
            <span class="suggestion-desc">Plan it, scaffold it, wire it up</span>
          </span>
        </button>

        <button class="suggestion" data-prompt="Review the code on my current branch and flag anything risky.">
          <svg class="icon" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
          <span>
            <span class="suggestion-title">Review code</span>
            <span class="suggestion-desc">Catch bugs and rough edges before merge</span>
          </span>
        </button>

        <button class="suggestion" data-prompt="Here's a failing test / error. Help me fix it.">
          <svg class="icon" viewBox="0 0 24 24"><path d="m8 2 1.88 1.88M14.12 3.88 16 2"/><path d="M9 7.13V6a3 3 0 1 1 6 0v1.13"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/><path d="M7.5 9h9a5 5 0 0 1-4.5 8 5 5 0 0 1-4.5-8Z"/></svg>
          <span>
            <span class="suggestion-title">Fix an issue</span>
            <span class="suggestion-desc">Paste an error, trace it to the cause</span>
          </span>
        </button>
      </div>
    </div>
  </section>

  <div class="composer-wrap">
    <div class="composer-col">
      <form class="composer" id="composer" onsubmit="return false">
        <textarea id="input" rows="2" placeholder="Ask anything, or describe what you want to build…"></textarea>
        <div class="composer-bar">
          <button class="ghost-btn" type="button" title="Attach">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="ghost-btn" type="button" id="composerProject">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V7a2 2 0 0 1 2-2h3.6a1 1 0 0 1 .8.4l1.2 1.6H18a2 2 0 0 1 2 2v11"/><path d="M2 20h20"/></svg>
            <span id="composerProjectName">Unsorted</span>
          </button>
          <a class="ghost-btn" href="plugins.html">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2H9v3a2 2 0 0 1-2 2H4v3a2 2 0 0 1 0 4v3h3a2 2 0 0 1 4 0h3v-3a2 2 0 0 1 2-2h3V9a2 2 0 0 1 0-4V2h-3"/></svg>
            Plugins
          </a>
          <button class="send" type="submit" id="send" title="Send">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
      </form>
      <p class="footnote">Sessions are saved to the project selected above.</p>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="app.js"></script>
<script>
renderSidebar('chat');

/* ---- which project a new chat lands in ---- */
let targetProject = State.projects[State.projects.length - 1] || null;

function paintTarget() {
  const name = targetProject ? targetProject.name : 'Unsorted';
  document.getElementById('projectPickerName').textContent = name;
  document.getElementById('composerProjectName').textContent = name;
}

function pickProject() {
  const body = document.createElement('div');
  body.innerHTML = '<div class="section-label" style="margin-top:0">File this chat under</div>';
  const list = document.createElement('div');
  list.style.cssText = 'display:flex;flex-direction:column;gap:1px';

  State.projects.forEach(p => {
    const b = document.createElement('button');
    b.className = 'nav-item';
    b.innerHTML = '<span class="swatch" style="background:' + p.color + '"></span><span></span>' +
      (p === targetProject ? '<span class="count">current</span>' : '');
    b.querySelectorAll('span')[1].textContent = p.name;
    b.addEventListener('click', () => { targetProject = p; paintTarget(); modal.close(); });
    list.appendChild(b);
  });

  const add = document.createElement('button');
  add.className = 'nav-item';
  add.innerHTML = svgIcon('plus') + 'New project';
  add.addEventListener('click', () => {
    modal.close();
    openProjectModal(null, () => {
      targetProject = State.projects[State.projects.length - 1];
      paintTarget();
    });
  });
  list.appendChild(add);
  body.appendChild(list);

  const modal = openModal({
    title: 'Project',
    body,
    confirmLabel: 'Done',
    onConfirm: () => {},
  });
}

document.getElementById('projectPicker').addEventListener('click', pickProject);
document.getElementById('composerProject').addEventListener('click', pickProject);
paintTarget();

/* ---- composer ---- */
const input = document.getElementById('input');
const composer = document.getElementById('composer');

function sync() {
  input.style.height = 'auto';
  input.style.height = Math.min(Math.max(input.scrollHeight, 46), 200) + 'px';
  composer.classList.toggle('has-text', input.value.trim().length > 0);
}

input.addEventListener('input', sync);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.getElementById('send').addEventListener('click', send);

/** Starting a chat files a session under the chosen project — the sidebar is
 *  the whole point of the picker, so it has to actually move. */
function send() {
  const text = input.value.trim();
  if (!text || !targetProject) return;
  const title = text.length > 44 ? text.slice(0, 44).trimEnd() + '…' : text;
  targetProject.sessions.unshift(title);
  targetProject.open = true;
  State.activeSession = title;
  saveState();
  renderSidebarProjects();
  input.value = '';
  sync();
}

document.querySelectorAll('.suggestion').forEach(card => {
  card.addEventListener('click', () => {
    input.value = card.dataset.prompt;
    input.focus();
    sync();
  });
});

input.focus();
</script>
</body>
</html>
