<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sub-agents · One Person Company</title>
<link rel="stylesheet" href="app.css" />
<style>
  .lane { margin-bottom: 30px; }

  .lane-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; }
  .lane-name { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; }
  .lane-rule { font-size: 12px; color: var(--muted); }
  .lane-note { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; max-width: 640px; }

  .agents { display: flex; flex-direction: column; gap: 6px; }

  .agent {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: border-color .12s ease;
  }

  .agent:hover { border-color: var(--line-strong); }

  .a-tile {
    width: 32px; height: 32px; flex: none;
    border-radius: 9px; display: grid; place-items: center;
    background: var(--hover); color: var(--text);
  }

  .agent[data-state="running"] .a-tile { background: var(--ok-bg); color: var(--ok); }
  .a-tile .icon { width: 16px; height: 16px; }

  .a-main { min-width: 0; flex: 1; }
  .a-top { display: flex; align-items: center; gap: 8px; }
  .a-name { font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em; }

  .a-kind {
    font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); padding-top: 1px;
  }

  .a-what {
    font-size: 12px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .a-state { flex: none; width: 208px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  .a-line { font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .a-line .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; }
  .agent[data-state="running"] .a-line .dot { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
  .agent[data-state="waiting"] .a-line .dot { background: var(--warn); }

  @keyframes pulse { 50% { opacity: .3; } }

  .a-target { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .a-runs { flex: none; display: flex; gap: 2px; align-items: center; }
  .tick { width: 5px; height: 16px; border-radius: 2px; background: var(--line); }
  .tick.done { background: var(--ok); opacity: .55; }
  .tick.failed { background: #b4442f; opacity: .7; }
  .tick.cancelled { background: var(--line); }

  .a-module {
    flex: none; font-size: 11.5px; color: var(--muted);
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 7px;
  }

  .a-module:hover { background: var(--hover); color: var(--text); }
  .a-module .icon { width: 12px; height: 12px; }

  .summary { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }

  .stat {
    flex: 1; min-width: 150px;
    padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .stat-v { font-size: 22px; font-weight: 400; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stat-k { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* ---- drawer detail ---- */

  .run { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
  .run:last-child { border-bottom: 0; }
  .run .badge { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .run.failed .badge { background: #b4442f; }
  .run.cancelled .badge { background: var(--muted); }
  .run .label { font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .when { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  .kv { display: flex; gap: 10px; font-size: 12.5px; padding: 6px 0; }
  .kv .k { color: var(--muted); width: 92px; flex: none; }
  .kv .v { color: var(--text); }
  .kv .v code { font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }

  @media (max-width: 900px) {
    .a-state { width: 150px; }
    .a-module { display: none; }
  }
</style>
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
  <header class="topbar">
    <button class="chip">Sub-agents</button>
    <div class="topbar-right">
      <button class="chip" id="refresh">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        Refresh queue
      </button>
    </div>
  </header>

  <div class="scroll">
    <div class="page">
      <div class="page-head">
        <div>
          <h1 class="page-title">Sub-agents</h1>
          <p class="page-sub">The standing workers, one per kind of job, read off the queue they all drain through.</p>
        </div>
      </div>

      <div class="summary" id="summary"></div>
      <div id="lanes"></div>

      <p class="empty-note" style="padding-top:18px">
        History goes back as far as the queue remembers — finished runs are kept for 48 hours, so this is
        the server's memory rather than a ledger.
      </p>
    </div>
  </div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="a-tile" id="dTile"></div>
    <div style="min-width:0">
      <div class="drawer-title" id="dName"></div>
      <div class="drawer-sub" id="dSub"></div>
    </div>
    <button class="drawer-close" id="dClose" aria-label="Close">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <p class="page-sub" id="dWhat" style="font-size:13px;margin-bottom:16px"></p>
    <div id="dMeta"></div>
    <div class="section-label">Now</div>
    <div id="dNow"></div>
    <div class="section-label">Recent runs</div>
    <div id="dHistory"></div>
  </div>
  <div class="drawer-foot">
    <button class="btn" id="dRun">Run now</button>
    <button class="btn ghost right" id="dOpen">Open module</button>
  </div>
</aside>

<script src="icons.js"></script>
<script src="app.js"></script>
<script>
/* ------------------------------------------------------------------ roster
 * One entry per queue kind, mirroring agent/queue.js. The two lanes are a real
 * difference rather than a grouping: the eight ai: kinds share one lane and so
 * run strictly one at a time — there is one GPU — while the five media kinds
 * are laneless, one run per kind and kinds in parallel. */

const AGENTS = [
  { kind: 'ai:people',      slug: 'dossiers',      name: 'Dossiers',      icon: 'target',   lane: 'ai',
    what: "Pulls a watched person's public activity, then writes their dossier.",
    module: 'People', target: 'Ada Lovelace',
    running: true, waiting: 2, history: ['done','done','failed','done','done','done'], last: '14m ago' },
  { kind: 'ai:research',    slug: 'research',      name: 'Research',      icon: 'cpu',      lane: 'ai',
    what: 'Investigates one of our own projects against the commercial web and writes the report.',
    module: 'Research', target: 'example-app-1',
    running: false, waiting: 1, history: ['done','done','done','cancelled','done'], last: '2h ago' },
  { kind: 'ai:competitors', slug: 'competitors',   name: 'Competitors',   icon: 'monitor',  lane: 'ai',
    what: "Sweeps a market's rivals — what they publish, price and rank for.",
    module: 'Competitors', target: 'AI video tools',
    running: false, waiting: 0, history: ['done','done','done','done'], last: '9h ago' },
  { kind: 'ai:seo',         slug: 'seo',           name: 'SEO',           icon: 'shield',   lane: 'ai',
    what: 'Reads the crawl and Search Console, and says what to change.',
    module: 'SEO', target: 'example.ie',
    running: false, waiting: 0, history: ['done','failed','done','done','done','done','done'], last: '18h ago' },
  { kind: 'ai:demand',      slug: 'demand',        name: 'Demand',        icon: 'sprout',   lane: 'ai',
    what: 'Reads what strangers asked for across the mined sources, per project.',
    module: 'Demand', target: 'freellmapi',
    running: false, waiting: 1, history: ['done','done','done'], last: 'yesterday' },
  { kind: 'ai:geo',         slug: 'ai-visibility', name: 'AI visibility', icon: 'globe',    lane: 'ai',
    what: 'Asks the models what they say about us, and scores where we stand.',
    module: 'SEO', target: 'the whole estate',
    running: false, waiting: 0, history: ['done','done','done','done','done'], last: 'yesterday' },
  { kind: 'ai:gardening',   slug: 'rounds',        name: 'The rounds',    icon: 'activity', lane: 'ai',
    what: 'Walks the whole estate, files what it finds as cards and notes.',
    module: 'Workflows', target: 'the whole estate',
    running: false, waiting: 0, history: ['done','done','done','done','done','done','done','done'], last: '06:00' },
  { kind: 'ai:academic',    slug: 'papers',        name: 'Papers',        icon: 'book',     lane: 'ai',
    what: "Reads the year's literature for a project and writes a paper into it.",
    module: 'Academic', target: 'example-app-4',
    running: false, waiting: 0, history: ['done','done'], last: '3d ago' },

  { kind: 'autopilot', slug: 'autopilot', name: 'Autopilot', icon: 'power',      lane: 'media',
    what: 'Works a run of projects end to end, making the videos each one is due.',
    module: 'Studio', target: '4 projects due',
    running: true, waiting: 0, history: ['done','done','failed','done'], last: 'running' },
  { kind: 'reel',      slug: 'reels',     name: 'Reels',     icon: 'flame',      lane: 'media',
    what: 'Renders a Peter & Stewie reel from its script.',
    module: 'Studio', target: 'reel #218',
    running: true, waiting: 3, history: ['done','done','done','done','done'], last: 'running' },
  { kind: 'shorts',    slug: 'shorts',    name: 'Shorts',    icon: 'megaphone',  lane: 'media',
    what: 'Cuts and renders the YouTube shorts in a batch.',
    module: 'Studio', target: 'batch of 6',
    running: false, waiting: 0, history: ['done','done','cancelled','done'], last: '4h ago' },
  { kind: 'faceless',  slug: 'faceless',  name: 'Faceless',  icon: 'copy',       lane: 'media',
    what: 'Writes, voices and renders a batch of faceless videos.',
    module: 'Studio', target: 'batch of 3',
    running: false, waiting: 2, history: ['done','failed','done','done'], last: '5h ago' },
  { kind: 'motion',    slug: 'motion',    name: 'Motion',    icon: 'pencil',     lane: 'media',
    what: 'Renders a motion-graphics clip from a prompt.',
    module: 'Studio', target: 'pricing explainer',
    running: false, waiting: 0, history: ['done','done','done'], last: '2d ago' },
];

/* Line-art marks for the roster, in the same stroke language as the rest of
   the shell — these are workers, not brands, so no colour tiles. */
const AGENT_SVG = {
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/>',
  cpu: '<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  shield: '<path d="M12 3 5 6v5.5c0 4.2 2.9 7.6 7 9.5 4.1-1.9 7-5.3 7-9.5V6Z"/>',
  sprout: '<path d="M12 21v-8"/><path d="M12 13C8 13 6 10.5 6 7c3.5 0 6 2 6 6Z"/><path d="M12 13c4 0 6-2.5 6-6-3.5 0-6 2-6 6Z"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/>',
  activity: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/>',
  power: '<path d="M12 3v9"/><path d="M6.5 7a8 8 0 1 0 11 0"/>',
  flame: '<path d="M12 3c4 4 6 6.5 6 10a6 6 0 0 1-12 0c0-2 1-3.5 2.5-5 .3 1.4 1 2.2 2 2.5C10 8 10.5 5.5 12 3Z"/>',
  megaphone: '<path d="m3 11 14-6v14L3 13Z"/><path d="M7 12.5V18a2 2 0 0 0 4 0v-4"/><path d="M20 10v4"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
};

const LANES = {
  ai: {
    name: 'AI lane',
    rule: 'one at a time',
    note: 'These eight share a single lane in the queue, so a dossier, an SEO analysis and a competitor sweep queued together drain in series. There is one GPU, and the waiting is real.',
  },
  media: {
    name: 'Media workers',
    rule: 'one run per kind, kinds in parallel',
    note: 'Laneless. Each of these can be working at the same time as the others, but never twice at once on itself.',
  },
};

/* ------------------------------------------------------------------ render */

const running = AGENTS.filter(a => a.running).length;
const waiting = AGENTS.reduce((n, a) => n + a.waiting, 0);
window.SUBAGENT_BADGE = running ? String(running) : '';

renderSidebar('subagents');

const finished = AGENTS.reduce((n, a) => n + a.history.length, 0);
const failed = AGENTS.reduce((n, a) => n + a.history.filter(h => h === 'failed').length, 0);

document.getElementById('summary').innerHTML = [
  [running, running === 1 ? 'working now' : 'working now'],
  [waiting, 'runs waiting'],
  [finished, 'finished · 48h window'],
  [failed, failed === 1 ? 'failure' : 'failures'],
].map(([v, k]) => '<div class="stat"><div class="stat-v">' + v + '</div><div class="stat-k">' + k + '</div></div>').join('');

const lanesEl = document.getElementById('lanes');

function agentIcon(name) {
  return '<svg class="icon" viewBox="0 0 24 24">' + (AGENT_SVG[name] || AGENT_SVG.activity) + '</svg>';
}

function stateOf(a) {
  return a.running ? 'running' : a.waiting ? 'waiting' : 'idle';
}

function stateLine(a) {
  if (a.running) return 'Working';
  if (a.waiting) return a.waiting + (a.waiting === 1 ? ' run waiting' : ' runs waiting');
  return 'Idle · last ' + a.last;
}

Object.keys(LANES).forEach(laneId => {
  const lane = LANES[laneId];
  const wrap = document.createElement('div');
  wrap.className = 'lane';

  const mine = AGENTS.filter(a => a.lane === laneId);
  wrap.innerHTML =
    '<div class="lane-head"><span class="lane-name">' + lane.name + '</span>' +
    '<span class="lane-rule">' + mine.length + ' workers · ' + lane.rule + '</span></div>' +
    '<p class="lane-note">' + lane.note + '</p>';

  const list = document.createElement('div');
  list.className = 'agents';

  mine.forEach(a => {
    const el = document.createElement('button');
    el.className = 'agent';
    el.dataset.state = stateOf(a);
    el.innerHTML =
      '<div class="a-tile">' + agentIcon(a.icon) + '</div>' +
      '<div class="a-main">' +
        '<div class="a-top"><span class="a-name"></span><span class="a-kind">' + a.kind + '</span></div>' +
        '<div class="a-what"></div>' +
      '</div>' +
      '<div class="a-runs">' + a.history.slice(0, 8).reverse().map(h =>
        '<span class="tick ' + h + '" title="' + h + '"></span>').join('') + '</div>' +
      '<div class="a-state">' +
        '<span class="a-line"><span class="dot"></span>' + stateLine(a) + '</span>' +
        '<span class="a-target">' + (a.running || a.waiting ? a.target : '—') + '</span>' +
      '</div>' +
      '<span class="a-module">' + svgIcon('external') + a.module + '</span>';

    el.querySelector('.a-name').textContent = a.name;
    el.querySelector('.a-what').textContent = a.what;
    el.addEventListener('click', () => openAgent(a));
    list.appendChild(el);
  });

  wrap.appendChild(list);
  lanesEl.appendChild(wrap);
});

/* ------------------------------------------------------------------ drawer */

const drawer = document.getElementById('drawer');
const scrim = ensureScrim();

function openAgent(a) {
  document.getElementById('dTile').innerHTML = agentIcon(a.icon);
  document.getElementById('dName').textContent = a.name;
  document.getElementById('dSub').textContent = LANES[a.lane].name + ' · ' + a.kind;
  document.getElementById('dWhat').textContent = a.what;

  document.getElementById('dMeta').innerHTML =
    '<div class="kv"><span class="k">Queue kind</span><span class="v"><code>' + a.kind + '</code></span></div>' +
    '<div class="kv"><span class="k">Lane</span><span class="v">' + LANES[a.lane].name + ' — ' + LANES[a.lane].rule + '</span></div>' +
    '<div class="kv"><span class="k">Output lands</span><span class="v">' + a.module + '</span></div>';

  const now = document.getElementById('dNow');
  if (a.running) {
    now.innerHTML = '<div class="run"><span class="badge"></span><span class="label">' + a.target +
      '</span><span class="when">working</span></div>';
  } else {
    now.innerHTML = '<p class="empty-note" style="padding:6px 0">Idle. Last run ' + a.last + '.</p>';
  }
  if (a.waiting) {
    for (let i = 0; i < a.waiting; i++) {
      now.insertAdjacentHTML('beforeend',
        '<div class="run cancelled"><span class="badge"></span><span class="label">' + a.target +
        '</span><span class="when">waiting</span></div>');
    }
  }

  const hist = document.getElementById('dHistory');
  hist.innerHTML = a.history.map((h, i) =>
    '<div class="run ' + h + '"><span class="badge"></span>' +
    '<span class="label">' + a.name + ' — ' + a.target + '</span>' +
    '<span class="when">' + h + ' · ' + (i + 1) * 3 + 'h ago</span></div>').join('');

  document.getElementById('dRun').textContent = a.running ? 'Queue another' : 'Run now';
  document.body.classList.add('drawer-open');
  drawer.setAttribute('aria-hidden', 'false');
}

function closeDrawer() {
  document.body.classList.remove('drawer-open');
  drawer.setAttribute('aria-hidden', 'true');
}

document.getElementById('dClose').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
document.getElementById('dOpen').addEventListener('click', closeDrawer);
document.getElementById('dRun').addEventListener('click', closeDrawer);
document.getElementById('refresh').addEventListener('click', () => location.reload());
</script>
</body>
</html>
